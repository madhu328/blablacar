name: Daily BlaBlaCar Scrape

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 pandas
          playwright install chromium
          playwright install-deps

      - name: Run scraper
        run: python3 scraper_headless.py

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: blablacar-day-${{ github.run_number }}
          path: blablacar_data.db
          retention-days: 30
